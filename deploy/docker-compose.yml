services:
  portfolio:
    image: ghcr.io/ikbalrslan/portfolio:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - proxy

# Join the shared reverse-proxy network (Caddy in ~/proxy on the VPS),
# so Caddy can reach this container as "portfolio:3000".
networks:
  proxy:
    name: proxy
    external: true
